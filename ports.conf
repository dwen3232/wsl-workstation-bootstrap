# WSL2 Portproxy Configuration
# One mapping per line. Lines starting with # are ignored. Blank lines are ignored.
#
# Preferred workflow:
#   1) Add or remove a mapping here
#   2) Run wsl-portproxy.ps1 or the "WSL2 Portproxy Refresh" scheduled task
#
# Supported formats:
#   <port>            # listen and connect on the same port
#   <listen>:<port>   # listen on one port, forward to a different WSL port
#
# Inline comments are allowed:
#   5000  # MLflow
#   443:8443  # HTTPS -> app inside WSL
#
# Built-in default:
#   SSH to WSL is already exposed on port 2222 via Windows OpenSSH ForceCommand.
#   Do not add 2222 here; that port is reserved and not managed by portproxy.
#
# The refresh script treats this file as the source of truth and will
# reconcile both portproxy and firewall rules to match it.
#
# Services must bind to 0.0.0.0 inside WSL2 (not 127.0.0.1) to be reachable.
#
# (no ports defined at install time)
